services:
  backend:
    build:
      target: prod
    ports:
      - "8080:8080"
    environment:
      GO_ENV: prod

  web:
    build:
      target: prod
    ports:
      - "3000:3000"

  mobile:
    build:
      target: prod
    # 通常 mobile は本番では起動しない
    deploy:
      replicas: 0

  db:
    environment:
      POSTGRES_USER: produser
      POSTGRES_PASSWORD: prodpass
      POSTGRES_DB: camapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data:
